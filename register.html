<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Food Delivery — Create Your Account</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" />
</head>

<body>

  <div class="register-page">
    <div class="register-card">

      <!-- Title -->
      <h1 class="register-title">Create Your Account</h1>
      <p class="register-subtitle">Join the UIU Food Delivery Portal</p>

      <!-- Role Selection -->
      <p class="register-role-label">Select Your Role</p>
      <div class="register-roles-grid">

        <!-- Ordering Student (selected) -->
        <a href="login.html" class="register-role-card selected">
          <span class="register-role-active-dot"></span>
          <div class="register-role-icon reg-icon-student">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f7a3e" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
          </div>
          <p class="register-role-name">Ordering Student</p>
          <p class="register-role-desc">Browse restaurants and o...</p>
        </a>

        <!-- Delivery Runner -->
        <a href="login.html" class="register-role-card">
          <div class="register-role-icon reg-icon-runner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2980b9" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="3" width="15" height="13" rx="2" />
              <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
              <circle cx="5.5" cy="18.5" r="2.5" />
              <circle cx="18.5" cy="18.5" r="2.5" />
            </svg>
          </div>
          <p class="register-role-name">Delivery Runner</p>
          <p class="register-role-desc">Deliver food and earn mo...</p>
        </a>

        <!-- Shop Owner -->
        <a href="login.html" class="register-role-card">
          <div class="register-role-icon reg-icon-shop">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e67e22" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </div>
          <p class="register-role-name">Shop Owner</p>
          <p class="register-role-desc">Manage restaurant order...</p>
        </a>

      </div>

      <!-- Divider -->
      <div class="register-divider"></div>

      <!-- Registration Form -->
      <form action="student-dashboard.html" method="get">

        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. John Doe" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-student-id">Student ID</label>
          <input type="text" id="reg-student-id" class="form-input" placeholder="e.g. 011 201 000" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">University Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="student@uiu.edu" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-input" placeholder="e.g. +8801XXXXXXXXX" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-icon-wrap">
            <!-- onkeyup calls checkPasswordStrength() from js/uiu-food.js -->
            <input type="password" id="reg-password" class="form-input" placeholder="Minimum 8 characters" onkeyup="checkPasswordStrength()" />
            <span class="input-icon-right">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </span>
          </div>
          <!-- JS password strength meter -->
          <p id="pwStrengthText" style="font-size:0.78rem; font-weight:600; min-height:16px; margin-top:4px;"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <div class="input-icon-wrap">
            <input type="password" id="reg-confirm" class="form-input" placeholder="Repeat your password" />
            <span class="input-icon-right">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </span>
          </div>
        </div>

        <!-- Terms & Conditions -->
        <div class="terms-row">
          <input type="checkbox" id="terms" class="terms-checkbox" checked />
          <label for="terms" class="terms-text">
            I agree to the <a href="login.html" class="terms-link">Terms &amp; Conditions</a>
          </label>
        </div>

        <!-- Register Button — calls validateRegister() from js/uiu-food.js -->
        <button type="button" id="btnRegister" class="btn btn-primary btn-full btn-lg" onclick="validateRegister()">
          Register
        </button>
        <!-- JS feedback: validateRegister() writes here via .textContent -->
        <p id="registerFeedback" style="text-align:center; font-size:0.85rem; font-weight:600; min-height:20px; margin-top:6px;"></p>

      </form>

      <!-- Back to Login -->
      <a href="login.html" class="register-back-link">Back to Login</a>

      <!-- Sign In row -->
      <p class="register-signin-row">
        Already have an account? <a href="login.html">Sign In</a>
      </p>

    </div>
  </div>
  <script src="js/uiu-food.js"></script>
</body>

</html>
