<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Food Portal — Burger Menu</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" />
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l19-9-9 19-2-8-8-2z" />
          </svg></div>
        <span class="sidebar-logo-text">UIU Food Portal</span>
      </div>
      <nav class="sidebar-nav">
        <a href="shop-dashboard.html" class="sidebar-nav-item"><svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>Dashboard</a>
        <a href="shop-orders.html" class="sidebar-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>Orders</a>
        <a href="shop-menu.html" class="sidebar-nav-item active"><svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>Menu</a>
        <a href="sales-history.html" class="sidebar-nav-item"><svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>Sales</a>
        <a href="shop-reports.html" class="sidebar-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
            <path d="M22 12A10 10 0 0 0 12 2v10z" />
          </svg>Reports</a>
        <a href="profile.html" class="sidebar-nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>Profile</a>
      </nav>
      <div class="sidebar-user">
        <img
          src="https://images.unsplash.com/photo-1607746882042-944635dfe10e?w=80&q=80&auto=format&fit=crop&face=center"
          alt="Chef Rahman" class="sidebar-user-avatar" />
        <div class="sidebar-user-info">
          <p class="sidebar-user-name">Chef Rahman</p>
          <p class="sidebar-user-role">Shop Owner Account</p>
          <a href="login.html" class="sidebar-logout"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>Log out</a>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="dash-topbar">
        <div class="dash-topbar-left">
          <a href="shop-menu.html" class="dash-topbar-back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12" />
              <polyline points="12 19 5 12 12 5" />
            </svg>Back</a>
          <h1 class="dash-topbar-title">Menu — Burgers</h1>
        </div>
      </div>

      <div class="shop-body">
        <div class="section-card-header" style="margin-bottom:var(--space-4);">
          <div style="display:flex; align-items:center; gap:var(--space-4);">
            <h2 class="section-card-title" style="margin:0;">Burgers</h2>
            <span style="font-size:var(--font-size-xs); color:var(--color-text-muted);">2 items</span>
          </div>
          <a href="shop-add-item.html" class="btn btn-primary"><i class="fa-solid fa-plus"
              style="margin-right:5px;"></i>Add New Item</a>
        </div>

        <div class="menu-category-tabs">
          <a href="shop-menu.html" class="menu-cat-tab">All Items</a>
          <a href="shop-menu-burgers.html" class="menu-cat-tab active">Burgers</a>
          <a href="shop-menu-pizza.html" class="menu-cat-tab">Pizza</a>
          <a href="shop-menu-rice.html" class="menu-cat-tab">Rice</a>
          <a href="shop-menu-drinks.html" class="menu-cat-tab">Drinks</a>
        </div>

        <div class="shop-menu-grid">
          <!-- Burger 1 -->
          <div class="menu-mgmt-card">
            <div class="menu-mgmt-img"><img
                src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80&auto=format&fit=crop"
                alt="Crispy Chicken Burger" /></div>
            <div class="menu-mgmt-controls">
              <div style="flex:1;">
                <p
                  style="font-size:var(--font-size-sm);font-weight:700;color:var(--color-text-primary);margin-bottom:2px;">
                  Crispy Chicken Burger</p>
                <p style="font-size:var(--font-size-xs);color:var(--color-text-muted);">Burgers &bull; <span
                    style="color:var(--color-primary);font-weight:600;">$4.50</span></p>
              </div>
              <label class="menu-toggle-label" for="b1">
                <input type="checkbox" class="menu-toggle-input" id="b1" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </label>
            </div>
            <div style="display:flex;gap:var(--space-2);padding:0 var(--space-4) var(--space-4);">
              <a href="shop-menu.html" class="tbl-btn-view-outline" style="flex:1;text-align:center;"><i
                  class="fa-solid fa-pen" style="margin-right:4px;font-size:0.7rem;"></i>Edit</a>
              <a href="shop-menu.html" class="tbl-btn-reject" style="flex:1;text-align:center;"><i
                  class="fa-solid fa-trash" style="margin-right:4px;font-size:0.7rem;"></i>Delete</a>
            </div>
          </div>

          <!-- Burger 2 -->
          <div class="menu-mgmt-card">
            <div class="menu-mgmt-img"><img
                src="https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=400&q=80&auto=format&fit=crop"
                alt="Double Beef Smash Burger" /></div>
            <div class="menu-mgmt-controls">
              <div style="flex:1;">
                <p
                  style="font-size:var(--font-size-sm);font-weight:700;color:var(--color-text-primary);margin-bottom:2px;">
                  Double Beef Smash Burger</p>
                <p style="font-size:var(--font-size-xs);color:var(--color-text-muted);">Burgers &bull; <span
                    style="color:var(--color-primary);font-weight:600;">$6.20</span></p>
              </div>
              <label class="menu-toggle-label" for="b2">
                <input type="checkbox" class="menu-toggle-input" id="b2" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </label>
            </div>
            <div style="display:flex;gap:var(--space-2);padding:0 var(--space-4) var(--space-4);">
              <a href="shop-menu.html" class="tbl-btn-view-outline" style="flex:1;text-align:center;"><i
                  class="fa-solid fa-pen" style="margin-right:4px;font-size:0.7rem;"></i>Edit</a>
              <a href="shop-menu.html" class="tbl-btn-reject" style="flex:1;text-align:center;"><i
                  class="fa-solid fa-trash" style="margin-right:4px;font-size:0.7rem;"></i>Delete</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
